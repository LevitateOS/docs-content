name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# The superproject's reusable workflows, pinned to one of its commits: this CI changes
# only when that pin is moved.
jobs:
  changes:
    uses: LevitateOS/LevitateOS/.github/workflows/detect-changes.yml@00996159fb2d8a454df85a292b78b9cb99ea90a6
    with:
      type: bun

  ci:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    uses: LevitateOS/LevitateOS/.github/workflows/bun-ci.yml@00996159fb2d8a454df85a292b78b9cb99ea90a6
    with:
      scripts: build typecheck
